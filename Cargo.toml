[package]
name = "anyfetch"
version = "0.8.3"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "Free web search and fetch for AI agents"
repository = "https://github.com/aliasmode/anyfetch"
homepage = "https://github.com/aliasmode/anyfetch"
readme = "README.md"
keywords = ["mcp", "web-search", "web-fetch", "ai-agents", "cli"]
categories = ["command-line-utilities", "web-programming::http-client"]

[dependencies]
clap = { version = "4", features = ["derive"] }
dom_query = { version = "=0.29", features = ["markdown"] }
encoding_rs = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
jaq-core = "3.1"
jaq-json = "2.0"
jaq-std = "3.0"
mime = "0.3"
pdf-extract = "=0.12"
dom_smoothie = "=0.19"
rmcp = { version = "=3.8", default-features = false, features = ["server", "macros", "transport-io"] }
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
url = "2"
wreq = { version = "=0.16", features = ["cookies", "charset", "stream", "gzip", "brotli", "deflate", "zstd"] }
wreq-util = { version = "=0.2", features = ["emulation", "emulation-compression"] }

# The jq child process limits its own memory.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net", "process", "time"] }

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
