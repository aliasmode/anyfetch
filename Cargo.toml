[package]
name = "fetchroam"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
description = "Free web search and fetch for AI agents"
repository = "https://github.com/dtheDavid/fetchroam"
homepage = "https://github.com/dtheDavid/fetchroam"
readme = "README.md"
keywords = ["mcp", "web-search", "web-fetch", "ai-agents", "cli"]
categories = ["command-line-utilities", "web-programming::http-client"]

[dependencies]
clap = { version = "4", features = ["derive"] }
dom_query = { version = "=0.28.0", features = ["markdown"] }
encoding_rs = "0.8"
mime = "0.3"
dom_smoothie = "=0.18.2"
rmcp = { version = "=3.1.2", default-features = false, features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
url = "2"
wreq = { version = "=0.16.1", features = ["cookies", "charset", "gzip", "brotli", "deflate", "zstd"] }
wreq-util = { version = "=0.2.0", features = ["emulation", "emulation-compression"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "net", "process", "time"] }

[profile.release]
lto = "thin"
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
