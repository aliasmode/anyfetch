# Publishes a release as a container image, and lists it in the MCP Registry.
#
# The image holds the release binary, so this runs after the Release workflow. Run it by hand
# with a tag to publish that release again.
name: Registry

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.6.0
        required: true

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}
      IMAGE: ghcr.io/aliasmode/anyfetch
    steps:
      - uses: actions/checkout@v6

      - name: Build the image for this machine
        run: docker build --build-arg VERSION="${TAG#v}" -t anyfetch .

      - name: Check that the image fetches a page and serves MCP
        run: |
          docker run --rm anyfetch fetch https://example.com/ | grep -q "Example Domain"
          start='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"check","version":"0"}}}'
          (echo "$start"; sleep 3) | docker run -i --rm anyfetch | grep -q '"name":"anyfetch"'

      - name: Push the image for both architectures
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 --build-arg VERSION="${TAG#v}" \
            -t "$IMAGE:${TAG#v}" -t "$IMAGE:latest" --push .

      - name: Publish to the MCP Registry
        run: |
          curl -fsSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar xz mcp-publisher
          jq --arg version "${TAG#v}" --arg image "$IMAGE" \
            '.version = $version | .packages[0].identifier = "\($image):\($version)"' server.json > filled.json
          mv filled.json server.json
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
